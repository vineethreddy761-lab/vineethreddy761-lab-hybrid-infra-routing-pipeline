---
- name: Local Infrastructure Configuration & Hardening
  hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
    - name: Ensure target configuration directory exists
      file:
        path: "{{ playbook_dir }}/generated_configs"
        state: directory
        mode: '0755'

    - name: Generate system compliance report
      copy:
        content: |
          Compliance Check Passed
          Executed By: Ansible Automation
          Target Host: localhost
          Timestamp: {{ ansible_date_time.iso8601 }}
        dest: "{{ playbook_dir }}/generated_configs/compliance_status.txt"

    - name: Display system execution details
      debug:
        msg: "Ansible configuration layer successfully applied to local target."
