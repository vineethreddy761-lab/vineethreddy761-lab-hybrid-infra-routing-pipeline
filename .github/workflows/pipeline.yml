name: Hybrid Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible terraform

      - name: Run Terraform Format / Validate Check
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run Ansible Lint / Syntax Check
        run: |
          ansible-playbook ansible/playbook.yml --syntax-check -i ansible/inventory
