frr version 8.4_git
frr defaults traditional
hostname enterprise-router-2
no ipv6 forwarding
!
interface lo
 ip address 10.10.10.2/32
exit
!
interface eth0
 ip ospf network point-to-point
exit
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 172.17.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  redistribute ospf route-map OSPF-TO-BGP
  neighbor 172.17.0.2 soft-reconfiguration inbound
  neighbor 172.17.0.2 route-map FROM-ROUTER1 in
  neighbor 172.17.0.2 route-map ALLOW-ALL out
 exit-address-family
exit
!
router ospf
 ospf router-id 2.2.2.2
 network 10.10.10.2/32 area 0
 network 172.17.0.0/16 area 0
exit
!
route-map ALLOW-ALL permit 10
exit
!
route-map OSPF-TO-BGP permit 10
 set metric 50
 set weight 200
exit
!
route-map FROM-ROUTER1 permit 10
 set local-preference 250
exit
!
end
